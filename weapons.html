<html lang="en">
<head>
    <meta charset="utf-8">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <div class="nav-inner">
    <div class="nav-links brand">
      <a href="index.html">
        <img src="site_images/logo.png" alt="MEGABONK DB" class="nav-logo">
      </a>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="characters.html">Characters</a>
      <a href="weapons.html">Weapons</a>
      <a href="tomes.html">Tomes</a>
      <a href="items.html">Items</a>
      <a href="index.html">WIP</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <header>
    <div class="header-top">
      <div>
        <h1>Weapons</h1>
      </div>
      <input id="search" type="search" placeholder="Search weapons...">
    </div>
  </header>

  <div class="table-container rpg-frame">
    <table class="data-table">
      <thead>
        <tr>
          <th>Weapon</th>
          <th>Description</th>
          <th>Unlock</th>
          <th>Affected by</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="hint" id="count"></div>
  <a href="index.html" class="back-link">← Back to Dashboard</a>
</div>

<script>
function placeholderIcon(letter){
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56'>
      <rect width='56' height='56' rx='14' fill='#1f1f2e'/>
      <text x='28' y='36' text-anchor='middle' font-size='18'
        fill='#bbb' font-family='system-ui' font-weight='700'>${letter}</text>
    </svg>`
  );
}

function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, m => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"
  }[m]));
}

function weaponFileName(name){
  return String(name)
    .replace(/[’‘]/g,"'")
    .replace(/'/g,"")
    .replace(/[^A-Za-z0-9]+/g,"_")
    .replace(/^_+|_+$/g,"");
}

function iconPath(weaponName){
  return `weapons/${weaponFileName(weaponName)}.png`;
}

const weapons = [
  {name:"Flamewalker", desc:"Leaves a trail of fire behind you.", unlock:"Unlocked by default", affected:"Size, Projectile Count, Duration, Damage"},
  {name:"Sword", desc:"Slashes through multiple enemies.", unlock:"Unlocked by default", affected:"Size, Projectile Count, Damage, Knockback"},
  {name:"Lightning Staff", desc:"Summons lightning to smite nearby enemies.", unlock:"Unlocked by default", affected:"Damage, Projectile Bounces, Projectile Count, Size"},
  {name:"Firestaff", desc:"Shoots fireballs that explode on impact.", unlock:"Unlocked by default", affected:"Projectile Speed, Size, Damage, Projectile Count"},
  {name:"Chunkers", desc:"Summons Chunky rocks that orbit around you.", unlock:"Unlocked by default", affected:"Size, Damage, Knockback, Projectile Speed, Projectile Count"},
  {name:"Bone", desc:"Throws bones that bounce off enemies.", unlock:"Unlocked by default", affected:"Damage, Projectile Bounces, Projectile Speed, Knockback, Projectile Count"},
  {name:"Bow", desc:"Shoots arrows that pierce enemies.", unlock:"Unlocked by default", affected:"Crit Chance, Crit Damage, Damage, Projectile Count, Projectile Speed, Size"},
  {name:"Revolver", desc:"Fires multiple bullets at enemies.", unlock:"Kill 7.500 enemies", affected:"Crit Chance, Crit Damage, Damage, Projectile Bounces, Projectile Count, Projectile Speed"},
  {name:"Aegis", desc:"Blocks incoming attacks and sends out shockwaves.", unlock:"Block 500 damage with armor as sir Oofie", affected:"Projectile Count, Size, Damage, Knockback"},
  {name:"Bananarang", desc:"Throws bananas that return to the owner.", unlock:"Find the hidden Banana", affected:"Damage, Projectile Count, Projectile Speed, Size"},
  {name:"Aura", desc:"Damage enemies in an area around you.", unlock:"Don't take any damage for 2 minutes", affected:"Damage, Size"},
  {name:"Axe", desc:"Throws spinning axes that deal area-damage.", unlock:"Kill 2.000 enemies using the Sword", affected:"Projectile Count, Duration, Damage, Size"},
  {name:"Space Noodle", desc:"Attaches to a nearby enemy. Deals damage to enemies in-between.", unlock:"Complete Desert Tier 2 as Tony McZoom", affected:"Damage, Size, Duration"},
  {name:"Sniper Rifle", desc:"Fires piercing bullets. Can be manually aimed.", unlock:"Get Precision Tome to Level 10", affected:"Damage, Projectile Count, Size"},
  {name:"Slutty Rocket", desc:"Fires Homing Missiles.", unlock:"Kill 15.000 enemies as CL4NK", affected:"Projectile Speed, Projectile Count, Damage, Crit Chance"},
  {name:"Shotgun", desc:"Fires a spread shot, stronger at close range. Can be manually aimed.", unlock:"5% chance to find upon breaking a Tumbleweed on Desert Stage 2", affected:"Crit Chance, Damage, Knockback, Projectile Count, Size"},
  {name:"Mines", desc:"Deploys mines around you that explode when enemies get close.", unlock:"Kill 7.500 enemies with Slutty Rocket", affected:"Duration, Damage, Size, Projectile Count"},
  {name:"Wireless Dagger", desc:"Fires smart daggers at your enemies. Wireless tech goes crazy these days.", unlock:"Get the Lightning Staff to level 15", affected:"Projectile Count, Projectile Speed, Damage, Projectile Bounces"},
  {name:"Frostwalker", desc:"Freezes and damages enemies in an area around you.", unlock:"Freeze 1.000 enemies with the Ice Cube", affected:"Damage, Size, Duration"},
  {name:"Tornado", desc:"Sends out tornadoes, knocking enemies back.", unlock:"Charge a Charge Shrine during a Sandstorm on Desert", affected:"Knockback, Damage, Size, Projectile Speed, Projectile Count"},
  {name:"Dexecutioner", desc:"A piercing blade. Small chance to instantly execute an enemy.", unlock:"Kill 12,500 enemies using the Sword", affected:"Crit Chance, Damage, Size, Projectile Count"},
  {name:"Blood Magic", desc:"Summons blood magic. 5% chance to increase Max HP upon killing enemies.", unlock:"Get the Bloody Tome to level 12", affected:"Damage, Projectile Count, Size"},
  {name:"Black Hole", desc:"Shoots a black hole that pulls enemies in.", unlock:"Get Knockback Tome to level 10", affected:"Duration, Damage, Size, Projectile Count"},
  {name:"Poison Flask", desc:"Throws toxic flasks on enemies, dealing area-damage and poisoning them.", unlock:"Kill Scorpionussy Miniboss on Desert 3 times", affected:"Damage, Duration, Projectile Count, Projectile Speed, Size"},
  {name:"Katana", desc:"A Sharp Blade that targets the closest enemy.", unlock:"5% chance to find upon breaking a Tumbleweed on Desert Stage 1", affected:"Size, Duration, Projectile Count, Damage, Critical Chance, Critical Damage"},
  {name:"Dragon's Breath", desc:"Fires a fierce dragon's breath in the movement direction.", unlock:"Kill 1.000 Wisp as Fox on Desert", affected:"Damage, Duration, Size"},
  {name:"Dice", desc:"Throw dice that deal 1-6 damage. Rolling a 6 increases the weapon's Crit Chance permanently.", unlock:"Get Luck Tome to level 12", affected:"Size, Crit Chance, Damage, Crit Damage, Projectile Speed, Projectile Count"},
  {name:"Hero Sword", desc:"Slashes through multiple enemies and fires a slashing projectile.", unlock:"Defeat a Stage Boss without picking up any items, powerups or using shrines", affected:"Damage, Projectile Count, Projectile Speed, Size"},
  {name:"Corrupted Sword", desc:"Slashes in both directions. Deals increased damage at low HP.", unlock:"Get Cursed Tome to level 20 in under 10 minutes", affected:""},
  {name:"Scythe", desc:"Slashes enemies in a circle. Has a charge attack that is activated whenever you kill Elite Enemies.", unlock:"Kill Big Bob on the Graveyard map.", affected:""}
];

const tbody = document.getElementById("tbody");
const count = document.getElementById("count");
const search = document.getElementById("search");

function render(){
  tbody.innerHTML = "";
  weapons.forEach(w => {
    const tr = document.createElement("tr");
    const src = iconPath(w.name);
    const letter = (w.name && w.name.length) ? w.name[0].toUpperCase() : "?";

    tr.innerHTML = `
      <td>
        <div class="item-cell">
          <div class="icon">
            <img src="${src}" alt="${esc(w.name)} icon"
                 onerror="this.onerror=null; this.src='${placeholderIcon(letter)}';">
          </div>
          <div class="name">${esc(w.name)}</div>
        </div>
      </td>
      <td>${esc(w.desc)}</td>
      <td>${esc(w.unlock)}</td>
      <td>${esc(w.affected)}</td>
    `;
    tbody.appendChild(tr);
  });

  count.textContent = `Showing ${weapons.length} weapons.`;
}

search.addEventListener("input", () => {
  const q = search.value.toLowerCase();
  let visible = 0;

  [...tbody.children].forEach(r => {
    const show = r.innerText.toLowerCase().includes(q);
    r.style.display = show ? "" : "none";
    if(show) visible++;
  });

  count.textContent = `Showing ${visible} of ${weapons.length} weapons.`;
});

render();
</script>

</body>
</html>
