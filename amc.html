
<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AMC Showtimes</title>


<style>


* {
    box-sizing: border-box;
}


html,
body {

    margin: 0;
    padding: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background: #101114;

    color: #f0f1f3;
}


button,
input {
    font: inherit;
}


/* ============================================================
   THEATER TABS
   ============================================================ */

.theater-tabs {

    height: 58px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 8px 12px;

    background: #15171b;

    border-bottom:
        1px solid #292c33;

    overflow-x: auto;

    overflow-y: hidden;

    white-space: nowrap;
}


.theater-tab {

    flex: 0 0 auto;

    border:
        1px solid #30343c;

    background: #1d2025;

    color: #c9ccd2;

    border-radius: 8px;

    padding: 9px 14px;

    cursor: pointer;

    transition:
        background .15s,
        border-color .15s;
}


.theater-tab:hover {

    background: #252930;

    color: white;
}


.theater-tab.active {

    background: #e31b23;

    border-color: #e31b23;

    color: white;

    font-weight: 600;
}


/* ============================================================
   PAGE
   ============================================================ */

.page {

    display: flex;

    width: 100%;

    height:
        calc(100vh - 58px);

    min-height: 0;
}


/* ============================================================
   SIDEBAR
   ============================================================ */

.sidebar {

    width: 280px;

    min-width: 280px;

    height: 100%;

    display: flex;

    flex-direction: column;

    background: #191b20;

    border-right:
        1px solid #292c33;

    overflow: hidden;
}


.sidebar-header {

    padding: 14px;

    border-bottom:
        1px solid #292c33;
}


.sidebar-title {

    font-size: 16px;

    font-weight: 700;

    margin-bottom: 9px;
}


.search {

    width: 100%;

    padding: 9px 10px;

    border-radius: 7px;

    border:
        1px solid #343840;

    background: #111318;

    color: white;

    outline: none;
}


.search:focus {

    border-color: #e31b23;
}


/* ============================================================
   MOVIE LIST
   ============================================================ */

.movie-list {

    flex: 1 1 0;

    min-height: 0;

    height: 0;

    overflow-y: auto;

    overflow-x: hidden;

    padding: 7px;
}


.movie-button {

    width: 100%;

    display: block;

    text-align: left;

    border: 0;

    border-radius: 7px;

    background: transparent;

    color: #c9ccd2;

    padding: 10px;

    margin-bottom: 3px;

    cursor: pointer;
}


.movie-button:hover {

    background: #24272d;

    color: white;
}


.movie-button.active {

    background: #30343c;

    color: white;
}


.movie-button-title {

    font-size: 14px;

    font-weight: 600;

    line-height: 1.3;
}


.movie-button-count {

    font-size: 11px;

    color: #8e939d;

    margin-top: 3px;
}


/* ============================================================
   CONTENT
   ============================================================ */

.content {

    flex: 1;

    min-width: 0;

    min-height: 0;

    height: 100%;

    overflow-y: auto;

    padding: 22px;
}


/* ============================================================
   MOVIE INFO
   ============================================================ */

.movie-info {

    display: flex;

    gap: 20px;

    margin-bottom: 24px;

    padding-bottom: 22px;

    border-bottom:
        1px solid #292c33;
}


.poster {

    flex:
        0 0 150px;

    width: 150px;

    height: 225px;

    object-fit: cover;

    border-radius: 9px;

    background: #1b1d22;

    border:
        1px solid #30343a;
}


.poster-placeholder {

    flex:
        0 0 150px;

    width: 150px;

    height: 225px;

    border-radius: 9px;

    background:
        linear-gradient(
            145deg,
            #202329,
            #15171b
        );

    border:
        1px solid #30343a;

    display: flex;

    align-items: center;

    justify-content: center;

    color: #666b74;

    font-size: 13px;

    text-align: center;

    padding: 20px;
}


.movie-details {

    min-width: 0;
}


.movie-title {

    font-size: 28px;

    line-height: 1.15;

    font-weight: 750;

    margin-bottom: 9px;
}


.movie-meta {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-bottom: 14px;
}


.meta-badge {

    background: #24272d;

    border:
        1px solid #333740;

    border-radius: 5px;

    padding: 4px 8px;

    color: #bfc3ca;

    font-size: 12px;
}


.description {

    max-width: 900px;

    color: #b8bcc4;

    line-height: 1.55;

    font-size: 14px;

    white-space: pre-line;
}


.credits {

    margin-top: 12px;

    color: #858a94;

    font-size: 12px;

    line-height: 1.5;
}


/* ============================================================
   DAYS
   ============================================================ */

.day {

    margin-bottom: 24px;
}


.day-header {

    display: flex;

    align-items: center;

    gap: 9px;

    margin-bottom: 9px;
}


.day-title {

    font-size: 18px;

    font-weight: 700;

    color: #f1f2f4;
}


.today-badge {

    background: #e31b23;

    color: white;

    border-radius: 5px;

    padding: 3px 7px;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: .4px;
}


/* ============================================================
   SHOWTIMES
   ============================================================ */

.showtime-list {

    display: flex;

    flex-direction: column;

    gap: 6px;
}


.showtime {

    width: 100%;

    min-height: 46px;

    display: grid;

    grid-template-columns:
        105px
        minmax(160px, 1fr)
        auto;

    align-items: center;

    gap: 12px;

    padding: 8px 11px;

    border:
        1px solid #30343c;

    border-radius: 7px;

    background: #191b20;

    text-decoration: none;

    color: inherit;
}


.showtime:hover {

    background: #22252b;

    border-color: #464b55;
}


.showtime-time {

    font-weight: 700;

    font-size: 15px;

    color: white;

    white-space: nowrap;
}


.showtime-info {

    min-width: 0;

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    align-items: center;
}


.auditorium {

    color: #aeb3bc;

    font-size: 12px;
}


.attribute {

    background: #282c33;

    color: #d4d7dc;

    padding: 3px 6px;

    border-radius: 4px;

    font-size: 10px;

    white-space: nowrap;
}


.status {

    display: flex;

    gap: 5px;

    justify-content: flex-end;

    flex-wrap: wrap;
}


.status-badge {

    border-radius: 4px;

    padding: 3px 7px;

    font-size: 10px;

    font-weight: 700;

    white-space: nowrap;
}


.sold-out {

    background: #5c2226;

    color: #ffb8bd;
}


.almost {

    background: #594719;

    color: #ffe29a;
}


.cancelled {

    background: #3d3d3d;

    color: #d0d0d0;
}


/* ============================================================
   EMPTY
   ============================================================ */

.empty {

    padding: 50px 20px;

    text-align: center;

    color: #737882;
}


.no-results {

    padding: 20px 10px;

    text-align: center;

    color: #777c85;

    font-size: 13px;
}


/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 700px) {

    html,
    body {
        overflow: auto;
    }


    .page {

        height: auto;

        min-height:
            calc(100vh - 58px);

        display: flex;

        flex-direction: column;
    }


    .sidebar {

        width: 100%;

        min-width: 0;

        height: 260px;

        min-height: 260px;

        border-right: none;

        border-bottom:
            1px solid #292c33;
    }


    .movie-list {

        height: 0;

        flex: 1 1 0;
    }


    .content {

        height: auto;

        overflow: visible;

        padding: 16px;
    }


    .movie-info {

        gap: 14px;
    }


    .poster,
    .poster-placeholder {

        flex-basis: 105px;

        width: 105px;

        height: 158px;
    }


    .movie-title {

        font-size: 22px;
    }


    .showtime {

        grid-template-columns:
            90px
            minmax(0, 1fr);
    }


    .status {

        grid-column: 2;

        justify-content: flex-start;
    }

}


@media (max-width: 480px) {

    .movie-info {

        flex-direction: column;
    }


    .poster,
    .poster-placeholder {

        width: 130px;

        height: 195px;

        flex-basis: auto;
    }

}


</style>

</head>


<body>


<div
    class="theater-tabs"
    id="theaterTabs"
></div>


<div class="page">


    <aside class="sidebar">

        <div class="sidebar-header">

            <div
                class="sidebar-title"
                id="sidebarTitle"
            >
                Movies
            </div>


            <input
                id="movieSearch"
                class="search"
                type="text"
                placeholder="Search movies..."
            >

        </div>


        <div
            class="movie-list"
            id="movieList"
        ></div>

    </aside>


    <main
        class="content"
        id="content"
    ></main>


</div>

let activeTheaterId = null;

let activeMovieTitle = null;


/* ============================================================
   HELPERS
   ============================================================ */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";
    }

    return String(value)
        .replaceAll(
            "&",
            "&amp;"
        )
        .replaceAll(
            "<",
            "&lt;"
        )
        .replaceAll(
            ">",
            "&gt;"
        )
        .replaceAll(
            '"',
            "&quot;"
        )
        .replaceAll(
            "'",
            "&#039;"
        );
}


function getTheaterIds() {

    return Object.keys(
        DATA
    );
}


function currentTheater() {

    if (!activeTheaterId) {
        return null;
    }

    return DATA[
        activeTheaterId
    ];
}


function currentMovies() {

    const theater =
        currentTheater();

    if (!theater) {
        return {};
    }

    return theater.movies || {};
}


function totalShowtimes(movie) {

    if (
        !movie ||
        !movie.showtimes
    ) {

        return 0;
    }

    return movie.showtimes.length;
}


/* ============================================================
   THEATER TABS
   ============================================================ */

function renderTheaterTabs() {

    const container =
        document.getElementById(
            "theaterTabs"
        );

    container.innerHTML = "";

    for (
        const id
        of getTheaterIds()
    ) {

        const theater =
            DATA[id];

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "theater-tab";

        if (
            id ===
            activeTheaterId
        ) {

            button.classList.add(
                "active"
            );
        }

        button.textContent =
            theater.name || id;

        button.addEventListener(
            "click",
            () => {

                activeTheaterId =
                    id;

                activeMovieTitle =
                    null;

                renderTheaterTabs();

                renderSidebar();

                const titles =
                    Object.keys(
                        currentMovies()
                    );

                if (
                    titles.length > 0
                ) {

                    activeMovieTitle =
                        titles[0];

                    renderSidebar();

                    renderMovie();
                }

                else {

                    document.getElementById(
                        "content"
                    ).innerHTML =
                        '<div class="empty">' +
                        'No movies found for this theater.' +
                        '</div>';
                }
            }
        );

        container.appendChild(
            button
        );
    }
}


/* ============================================================
   SIDEBAR
   ============================================================ */

function renderSidebar() {

    const list =
        document.getElementById(
            "movieList"
        );

    const title =
        document.getElementById(
            "sidebarTitle"
        );

    const theater =
        currentTheater();

    if (!theater) {

        list.innerHTML = "";

        return;
    }

    title.textContent =
        theater.name ||
        "Movies";

    const search =
        document
            .getElementById(
                "movieSearch"
            )
            .value
            .trim()
            .toLowerCase();

    list.innerHTML = "";

    const movies =
        currentMovies();

    let visibleCount = 0;

    for (
        const [
            movieTitle,
            movie
        ]
        of Object.entries(movies)
    ) {

        if (
            search &&
            !movieTitle
                .toLowerCase()
                .includes(search)
        ) {

            continue;
        }

        visibleCount++;

        const button =
            document.createElement(
                "button"
            );

        button.className =
            "movie-button";

        if (
            movieTitle ===
            activeMovieTitle
        ) {

            button.classList.add(
                "active"
            );
        }

        const titleDiv =
            document.createElement(
                "div"
            );

        titleDiv.className =
            "movie-button-title";

        titleDiv.textContent =
            movieTitle;

        const countDiv =
            document.createElement(
                "div"
            );

        countDiv.className =
            "movie-button-count";

        countDiv.textContent =
            totalShowtimes(movie) +
            " showtimes";

        button.appendChild(
            titleDiv
        );

        button.appendChild(
            countDiv
        );

        button.addEventListener(
            "click",
            () => {

                activeMovieTitle =
                    movieTitle;

                renderSidebar();

                renderMovie();
            }
        );

        list.appendChild(
            button
        );
    }

    if (
        visibleCount === 0
    ) {

        list.innerHTML =
            '<div class="no-results">' +
            'No movies found.' +
            '</div>';
    }
}


/* ============================================================
   MOVIE INFO
   ============================================================ */

function renderMovieInfo(
    title,
    movie
) {

    const info =
        movie.info || {};

    let posterHtml = "";


    if (info.poster) {

        posterHtml =
            '<img class="poster" ' +
            'src="' +
            escapeHtml(
                info.poster
            ) +
            '" ' +
            'alt="' +
            escapeHtml(title) +
            ' poster" ' +
            'loading="lazy">';
    }

    else {

        posterHtml =
            '<div class="poster-placeholder">' +
            'No artwork available' +
            '</div>';
    }


    let badges = "";


    if (info.rating) {

        badges +=
            '<span class="meta-badge">' +
            escapeHtml(
                info.rating
            ) +
            '</span>';
    }


    if (info.runtime) {

        badges +=
            '<span class="meta-badge">' +
            escapeHtml(
                info.runtime
            ) +
            '</span>';
    }


    if (info.genre) {

        badges +=
            '<span class="meta-badge">' +
            escapeHtml(
                info.genre
            ) +
            '</span>';
    }


    let credits = "";


    if (info.directors) {

        credits +=
            "<div>" +
            "<strong>Director:</strong> " +
            escapeHtml(
                info.directors
            ) +
            "</div>";
    }


    if (info.cast) {

        credits +=
            "<div>" +
            "<strong>Cast:</strong> " +
            escapeHtml(
                info.cast
            ) +
            "</div>";
    }


    return (

        '<section class="movie-info">' +

            posterHtml +

            '<div class="movie-details">' +

                '<div class="movie-title">' +
                    escapeHtml(title) +
                '</div>' +

                (
                    badges
                    ?
                    '<div class="movie-meta">' +
                        badges +
                    '</div>'
                    :
                    ""
                ) +

                (
                    info.description
                    ?
                    '<div class="description">' +
                        escapeHtml(
                            info.description
                        ) +
                    '</div>'
                    :
                    ""
                ) +

                (
                    credits
                    ?
                    '<div class="credits">' +
                        credits +
                    '</div>'
                    :
                    ""
                ) +

            '</div>' +

        '</section>'
    );
}


/* ============================================================
   SHOWTIME
   ============================================================ */

function renderShowtime(
    showtime
) {

    let attributes = "";


    for (
        const attribute
        of (
            showtime.attributes ||
            []
        )
    ) {

        attributes +=
            '<span class="attribute">' +
            escapeHtml(
                attribute
            ) +
            '</span>';
    }


    let status = "";


    if (
        showtime.sold_out
    ) {

        status +=
            '<span class="status-badge sold-out">' +
            'Sold Out' +
            '</span>';
    }

    else if (
        showtime.almost_sold_out
    ) {

        status +=
            '<span class="status-badge almost">' +
            'Almost Sold Out' +
            '</span>';
    }


    if (
        showtime.cancelled
    ) {

        status +=
            '<span class="status-badge cancelled">' +
            'Cancelled' +
            '</span>';
    }


    const url =
        showtime.purchase_url ||
        "#";


    return (

        '<a class="showtime" ' +

        (
            showtime.cancelled
            ?
            ""
            :
            'href="' +
            escapeHtml(url) +
            '" ' +
            'target="_blank" ' +
            'rel="noopener"'
        ) +

        '>' +

            '<div class="showtime-time">' +
                escapeHtml(
                    showtime.time
                ) +
            '</div>' +

            '<div class="showtime-info">' +

                (
                    showtime.auditorium
                    ?
                    '<span class="auditorium">' +
                        escapeHtml(
                            showtime.auditorium
                        ) +
                    '</span>'
                    :
                    ""
                ) +

                attributes +

            '</div>' +

            '<div class="status">' +
                status +
            '</div>' +

        '</a>'
    );
}


/* ============================================================
   MOVIE PAGE
   ============================================================ */

function renderMovie() {

    const content =
        document.getElementById(
            "content"
        );

    const movies =
        currentMovies();

    const movie =
        movies[
            activeMovieTitle
        ];

    if (!movie) {

        content.innerHTML =
            '<div class="empty">' +
            'Select a movie.' +
            '</div>';

        return;
    }


    let html =
        renderMovieInfo(
            activeMovieTitle,
            movie
        );


    const grouped = {};


    for (
        const showtime
        of (
            movie.showtimes ||
            []
        )
    ) {

        if (
            !grouped[
                showtime.date_iso
            ]
        ) {

            grouped[
                showtime.date_iso
            ] = {

                label:
                    showtime.date,

                showtimes:
                    []
            };
        }


        grouped[
            showtime.date_iso
        ].showtimes.push(
            showtime
        );
    }


    const dates =
        Object.keys(
            grouped
        ).sort();


    const todayIso =
        new Date()
            .toISOString()
            .slice(0, 10);


    for (
        const date
        of dates
    ) {

        const day =
            grouped[date];


        day.showtimes.sort(
            (a, b) =>
                a.time.localeCompare(
                    b.time
                )
        );


        const isToday =
            date === todayIso;


        html +=
            '<section class="day">' +

                '<div class="day-header">' +

                    '<div class="day-title">' +
                        escapeHtml(
                            day.label
                        ) +
                    '</div>' +

                    (
                        isToday
                        ?
                        '<span class="today-badge">' +
                        'TODAY' +
                        '</span>'
                        :
                        ""
                    ) +

                '</div>' +

                '<div class="showtime-list">';


        for (
            const showtime
            of day.showtimes
        ) {

            html +=
                renderShowtime(
                    showtime
                );
        }


        html +=
                '</div>' +
            '</section>';
    }


    content.innerHTML =
        html;
}


/* ============================================================
   SEARCH
   ============================================================ */

document
    .getElementById(
        "movieSearch"
    )
    .addEventListener(
        "input",
        () => {

            renderSidebar();
        }
    );


/* ============================================================
   INITIALIZE
   ============================================================ */

const theaterIds =
    getTheaterIds();


if (
    theaterIds.length > 0
) {

    activeTheaterId =
        theaterIds[0];

    renderTheaterTabs();


    const movies =
        Object.keys(
            currentMovies()
        );


    if (
        movies.length > 0
    ) {

        activeMovieTitle =
            movies[0];
    }


    renderSidebar();

    renderMovie();

}

else {

    document.getElementById(
        "content"
    ).innerHTML =
        '<div class="empty">' +
        'No theaters configured.' +
        '</div>';
}


</script>


</body>

</html>
