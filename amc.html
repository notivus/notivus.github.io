<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AMC Showtimes</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    height: 100%;
}

body {
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    background: #111317;
    color: #f4f4f5;

    overflow: hidden;
}


/* =========================================================
   THEATER TABS
   ========================================================= */

.theater-bar {

    display: flex;

    gap: 8px;

    padding: 12px 16px;

    background: #191b20;

    border-bottom: 1px solid #292c33;

    overflow-x: auto;

    white-space: nowrap;

    scrollbar-width: thin;
}

.theater-tab {

    border: 1px solid #343840;

    background: #22252b;

    color: #bfc3cb;

    padding: 9px 15px;

    border-radius: 7px;

    cursor: pointer;

    font-size: 13px;

    font-weight: 600;

    transition:
        background 0.15s,
        border-color 0.15s,
        color 0.15s;
}

.theater-tab:hover {

    background: #2b2e35;

    color: white;
}

.theater-tab.active {

    background: #e51937;

    border-color: #e51937;

    color: white;
}


/* =========================================================
   MAIN LAYOUT
   ========================================================= */

.main {

    display: grid;

    grid-template-columns:
        280px
        minmax(0, 1fr);

    height: calc(100vh - 58px);
}


/* =========================================================
   MOVIE SIDEBAR
   ========================================================= */

.sidebar {

    background: #191b20;

    border-right: 1px solid #292c33;

    display: flex;

    flex-direction: column;

    min-width: 0;
}

.sidebar-header {

    padding: 16px;

    border-bottom: 1px solid #292c33;
}

.theater-name {

    font-size: 16px;

    font-weight: 700;

    margin-bottom: 11px;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}

.search {

    width: 100%;

    padding: 9px 11px;

    border-radius: 6px;

    border: 1px solid #343840;

    background: #111317;

    color: white;

    outline: none;

    font-size: 13px;
}

.search:focus {

    border-color: #666c77;
}

.movie-list {

    overflow-y: auto;

    padding: 7px;

    flex: 1;
}

.movie-item {

    padding: 10px 11px;

    margin-bottom: 2px;

    border-radius: 6px;

    cursor: pointer;

    color: #b9bdc6;

    font-size: 13px;

    line-height: 1.35;

    transition:
        background 0.12s,
        color 0.12s;
}

.movie-item:hover {

    background: #24272d;

    color: white;
}

.movie-item.active {

    background: #2b2e35;

    color: white;

    font-weight: 600;
}


/* =========================================================
   CONTENT
   ========================================================= */

.content {

    min-width: 0;

    overflow-y: auto;

    padding: 24px 28px 40px;
}

.content-header {

    margin-bottom: 24px;
}

.content-title {

    margin: 0;

    font-size: 24px;

    font-weight: 700;

    line-height: 1.2;
}

.content-subtitle {

    margin-top: 6px;

    color: #858b96;

    font-size: 12px;
}


/* =========================================================
   DAY GROUP
   ========================================================= */

.day {

    margin-bottom: 25px;

    max-width: 850px;
}

.day-header {

    display: flex;

    align-items: center;

    gap: 9px;

    margin-bottom: 8px;

    padding-bottom: 7px;

    border-bottom: 1px solid #292c33;
}

.day-name {

    font-size: 13px;

    font-weight: 700;

    color: #dfe1e5;
}

.today-badge {

    font-size: 10px;

    font-weight: 700;

    color: #e51937;

    background: rgba(229, 25, 55, 0.12);

    border: 1px solid rgba(229, 25, 55, 0.3);

    border-radius: 4px;

    padding: 2px 5px;
}


/* =========================================================
   SHOWTIMES
   ========================================================= */

.showtimes {

    display: flex;

    flex-direction: column;

    gap: 6px;

    width: 100%;

    max-width: 720px;
}

.showtime {

    display: grid;

    grid-template-columns:
        105px
        minmax(0, 1fr)
        auto;

    grid-template-rows: 1fr;

    align-items: center;

    width: 100%;

    min-height: 50px;

    padding: 0 14px;

    border-radius: 7px;

    background: #202329;

    border: 1px solid #30343b;

    color: white;

    text-decoration: none;

    transition:
        background 0.15s,
        border-color 0.15s,
        transform 0.15s;
}

.showtime:hover {

    background: #292d34;

    border-color: #505661;

    transform: translateX(2px);
}

.showtime.cancelled {

    opacity: 0.5;

    text-decoration: line-through;
}

.showtime-time {

    font-size: 15px;

    font-weight: 600;

    white-space: nowrap;

    text-align: left;
}

.showtime-info {

    min-width: 0;

    padding-right: 12px;

    color: #969ca7;

    font-size: 12px;

    text-align: left;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
}

.badges {

    display: flex;

    align-items: center;

    justify-content: flex-end;

    gap: 4px;

    flex-wrap: wrap;
}

.badge {

    display: inline-flex;

    align-items: center;

    white-space: nowrap;

    font-size: 10px;

    line-height: 1;

    padding: 4px 6px;

    border-radius: 4px;

    background: #30343b;

    color: #c7cad0;

    font-weight: 600;
}

.badge.sold-out {

    background: #51252b;

    color: #ffb4bd;
}

.badge.almost {

    background: #514325;

    color: #f4d58b;
}

.badge.cancelled {

    background: #403f42;

    color: #bcbcc1;
}


/* =========================================================
   EMPTY STATE
   ========================================================= */

.empty {

    padding: 30px 10px;

    color: #747a85;

    font-size: 13px;
}

.loading {

    color: #777d88;

    font-size: 13px;
}


/* =========================================================
   MOBILE
   ========================================================= */

@media (max-width: 750px) {

    body {
        overflow: auto;
    }

    .main {

        grid-template-columns: 1fr;

        height: auto;

        min-height: calc(100vh - 58px);
    }

    .sidebar {

        border-right: none;

        border-bottom: 1px solid #292c33;

        max-height: 260px;
    }

    .movie-list {

        max-height: 150px;
    }

    .content {

        padding: 20px 14px 35px;
    }

    .content-title {

        font-size: 20px;
    }

    .showtime {

        grid-template-columns:
            88px
            minmax(0, 1fr)
            auto;

        min-height: 48px;

        padding: 0 10px;
    }

    .showtime-time {

        font-size: 14px;
    }

    .showtime-info {

        font-size: 11px;

        padding-right: 7px;
    }

    .badge {

        font-size: 9px;

        padding: 3px 5px;
    }
}


/* =========================================================
   VERY SMALL SCREENS
   ========================================================= */

@media (max-width: 430px) {

    .showtime {

        grid-template-columns:
            76px
            minmax(0, 1fr);
    }

    .badges {

        display: none;
    }

    .showtime-info {

        padding-right: 0;
    }
}

</style>

</head>


<body>


<!-- =======================================================
     THEATER TABS
     ======================================================= -->

<div class="theater-bar" id="theaterBar">
</div>


<!-- =======================================================
     MAIN
     ======================================================= -->

<div class="main">


    <!-- ===================================================
         SIDEBAR
         =================================================== -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <div
                class="theater-name"
                id="theaterName"
            >
                Loading...
            </div>

            <input
                type="text"
                class="search"
                id="movieSearch"
                placeholder="Search movies..."
                autocomplete="off"
            >

        </div>


        <div
            class="movie-list"
            id="movieList"
        >
        </div>

    </aside>


    <!-- ===================================================
         CONTENT
         =================================================== -->

    <main class="content">

        <div class="content-header">

            <h1
                class="content-title"
                id="movieTitle"
            >
                Select a movie
            </h1>

            <div
                class="content-subtitle"
                id="contentSubtitle"
            >
            </div>

        </div>


        <div id="showtimeContainer">
        </div>

    </main>

</div>

let currentTheater = null;
let currentMovie = null;


/* =========================================================
   HELPERS
   ========================================================= */

function escapeHtml(value) {

    const div = document.createElement("div");

    div.textContent = value;

    return div.innerHTML;
}


/* =========================================================
   THEATER TABS
   ========================================================= */

function renderTheaterTabs() {

    const bar = document.getElementById(
        "theaterBar"
    );

    bar.innerHTML = "";

    Object.entries(DATA).forEach(
        ([theaterId, theater]) => {

            const button =
                document.createElement("button");

            button.className = "theater-tab";

            if (theaterId === currentTheater) {
                button.classList.add("active");
            }

            button.textContent = theater.name;

            button.addEventListener(
                "click",
                () => {
                    selectTheater(theaterId);
                }
            );

            bar.appendChild(button);
        }
    );
}


/* =========================================================
   MOVIE LIST
   ========================================================= */

function renderMovieList() {

    const list =
        document.getElementById("movieList");

    const search =
        document.getElementById("movieSearch")
            .value
            .toLowerCase()
            .trim();

    list.innerHTML = "";

    const theater =
        DATA[currentTheater];

    if (!theater) {
        return;
    }

    const movies =
        Object.keys(theater.movies)
            .filter(movie =>
                movie
                    .toLowerCase()
                    .includes(search)
            );

    if (movies.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "No movies found.";

        list.appendChild(empty);

        return;
    }

    movies.forEach(movie => {

        const item =
            document.createElement("div");

        item.className = "movie-item";

        if (movie === currentMovie) {
            item.classList.add("active");
        }

        item.textContent = movie;

        item.addEventListener(
            "click",
            () => {
                selectMovie(movie);
            }
        );

        list.appendChild(item);
    });
}


/* =========================================================
   SHOWTIMES
   ========================================================= */

function renderShowtimes() {

    const container =
        document.getElementById(
            "showtimeContainer"
        );

    const title =
        document.getElementById(
            "movieTitle"
        );

    const subtitle =
        document.getElementById(
            "contentSubtitle"
        );

    container.innerHTML = "";

    const theater =
        DATA[currentTheater];

    if (!theater) {
        return;
    }

    const showtimes =
        theater.movies[currentMovie];

    title.textContent =
        currentMovie || "Select a movie";

    subtitle.textContent =
        theater.name;

    if (!showtimes || showtimes.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty";

        empty.textContent =
            "No showtimes available.";

        container.appendChild(empty);

        return;
    }


    /* -----------------------------------------------------
       Group showtimes by date
       ----------------------------------------------------- */

    const grouped = {};

    showtimes.forEach(showtime => {

        if (!grouped[showtime.date_iso]) {
            grouped[showtime.date_iso] = {
                label: showtime.date,
                entries: []
            };
        }

        grouped[
            showtime.date_iso
        ].entries.push(showtime);
    });


    /* -----------------------------------------------------
       Render each day
       ----------------------------------------------------- */

    Object.entries(grouped)
        .sort(([dateA], [dateB]) =>
            dateA.localeCompare(dateB)
        )
        .forEach(([dateIso, day]) => {

            const dayDiv =
                document.createElement("section");

            dayDiv.className = "day";


            /* ---------------------------------------------
               Day header
               --------------------------------------------- */

            const header =
                document.createElement("div");

            header.className =
                "day-header";


            const dayName =
                document.createElement("div");

            dayName.className =
                "day-name";

            dayName.textContent =
                day.label;

            header.appendChild(dayName);


            /* ---------------------------------------------
               Today badge
               --------------------------------------------- */

            const today =
                new Date()
                    .toISOString()
                    .slice(0, 10);

            if (dateIso === today) {

                const badge =
                    document.createElement("span");

                badge.className =
                    "today-badge";

                badge.textContent =
                    "TODAY";

                header.appendChild(badge);
            }


            dayDiv.appendChild(header);


            /* ---------------------------------------------
               Showtime list
               --------------------------------------------- */

            const showtimesDiv =
                document.createElement("div");

            showtimesDiv.className =
                "showtimes";


            day.entries
                .sort((a, b) =>
                    a.time.localeCompare(b.time)
                )
                .forEach(showtime => {

                    const link =
                        document.createElement("a");

                    link.className =
                        "showtime";

                    if (showtime.cancelled) {
                        link.classList.add(
                            "cancelled"
                        );
                    }

                    if (
                        showtime.purchase_url &&
                        showtime.purchase_url !== "#"
                    ) {

                        link.href =
                            showtime.purchase_url;

                        link.target =
                            "_blank";

                        link.rel =
                            "noopener noreferrer";

                    } else {

                        link.href = "#";

                        link.addEventListener(
                            "click",
                            event => {
                                event.preventDefault();
                            }
                        );
                    }


                    /* -------------------------------------
                       Time
                       ------------------------------------- */

                    const time =
                        document.createElement("div");

                    time.className =
                        "showtime-time";

                    time.textContent =
                        showtime.time;

                    link.appendChild(time);


                    /* -------------------------------------
                       Auditorium / attributes
                       ------------------------------------- */

                    const info =
                        document.createElement("div");

                    info.className =
                        "showtime-info";

                    const pieces = [];

                    if (showtime.auditorium) {
                        pieces.push(
                            showtime.auditorium
                        );
                    }

                    if (
                        showtime.attributes &&
                        showtime.attributes.length
                    ) {
                        pieces.push(
                            showtime.attributes.join(
                                " • "
                            )
                        );
                    }

                    info.textContent =
                        pieces.join(" • ");

                    link.appendChild(info);


                    /* -------------------------------------
                       Badges
                       ------------------------------------- */

                    const badges =
                        document.createElement("div");

                    badges.className =
                        "badges";


                    if (showtime.sold_out) {

                        const badge =
                            document.createElement("span");

                        badge.className =
                            "badge sold-out";

                        badge.textContent =
                            "SOLD OUT";

                        badges.appendChild(badge);
                    }


                    if (
                        showtime.almost_sold_out
                    ) {

                        const badge =
                            document.createElement("span");

                        badge.className =
                            "badge almost";

                        badge.textContent =
                            "ALMOST SOLD OUT";

                        badges.appendChild(badge);
                    }


                    if (showtime.cancelled) {

                        const badge =
                            document.createElement("span");

                        badge.className =
                            "badge cancelled";

                        badge.textContent =
                            "CANCELLED";

                        badges.appendChild(badge);
                    }


                    if (badges.children.length > 0) {
                        link.appendChild(badges);
                    }


                    showtimesDiv.appendChild(link);
                });


            dayDiv.appendChild(showtimesDiv);

            container.appendChild(dayDiv);
        });
}


/* =========================================================
   SELECT THEATER
   ========================================================= */

function selectTheater(theaterId) {

    currentTheater = theaterId;

    const theater =
        DATA[theaterId];

    const movies =
        Object.keys(theater.movies);

    currentMovie =
        movies.length > 0
            ? movies[0]
            : null;


    document.getElementById(
        "theaterName"
    ).textContent =
        theater.name;


    document.getElementById(
        "movieSearch"
    ).value = "";


    renderTheaterTabs();

    renderMovieList();

    renderShowtimes();
}


/* =========================================================
   SELECT MOVIE
   ========================================================= */

function selectMovie(movie) {

    currentMovie = movie;

    renderMovieList();

    renderShowtimes();
}


/* =========================================================
   SEARCH
   ========================================================= */

document
    .getElementById("movieSearch")
    .addEventListener(
        "input",
        renderMovieList
    );


/* =========================================================
   INITIALIZE
   ========================================================= */

const firstTheater =
    Object.keys(DATA)[0];

if (firstTheater) {

    selectTheater(firstTheater);

} else {

    document.getElementById(
        "theaterName"
    ).textContent =
        "No theaters configured";

    document.getElementById(
        "movieTitle"
    ).textContent =
        "No data";

    document.getElementById(
        "showtimeContainer"
    ).innerHTML =
        '<div class="empty">No theater data was loaded.</div>';
}

</script>
