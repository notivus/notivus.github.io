<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Megabonk Characters</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
  <div class="nav-inner">
    <div class="nav-links brand">
      <a href="index.html">
        <img src="site_images/logo.png" alt="MEGABONK DB" class="nav-logo">
      </a>
    </div>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="characters.html">Characters</a>
      <a href="weapons.html">Weapons</a>
      <a href="tomes.html">Tomes</a>
      <a href="items.html">Items</a>
      <a href="index.html">WIP</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <header>
    <div class="header-top">
      <div>
        <h1>Characters</h1>
      </div>
      <input id="search" type="search" placeholder="Search characters...">
    </div>
  </header>

  <div class="table-container rpg-frame">
    <table class="data-table">
      <thead>
        <tr>
          <th>Character</th>
          <th>Weapon</th>
          <th>Passive Ability</th>
          <th>Prerequisites</th>
          <th>Silver Cost</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="hint" id="count"></div>
  <a href="index.html" class="back-link">← Back to Dashboard</a>
</div>

<script>
function placeholderIcon(letter){
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
    `<svg xmlns='http://www.w3.org/2000/svg' width='56' height='56'>
      <rect width='56' height='56' rx='14' fill='#1f1f2e'/>
      <text x='28' y='36' text-anchor='middle' font-size='18'
        fill='#bbb' font-family='system-ui' font-weight='700'>${letter}</text>
    </svg>`
  );
}

function iconPath(name){
  return "characters/" + String(name).replace(/ /g,"_") + ".png";
}

const characters = [
  ["Fox","Firestaff","RNG Blessing: Gain 2% Luck per level.","Unlocked by Default","Unlocked"],
  ["Sir Oofie","Sword","Reinforced: Gain 1% Armor per level.","Unlocked by Default","Unlocked"],
  ["Calcium","Bone","Speed Demon: Speed builds up over time, but is halved when you take damage. Also gain damage based on speed.","Kill 1,000 Skeletons; Buy Bone","9"],
  ["Megachad","Aura","Flex: Flex to stop damage. Cooldown -0.2s per level. Gain 2.5% Damage when flexing.","Get the Damage Tome to level 7","10"],
  ["Ogre","Axe","Warrior: Gain 1.5% Damage per level.","Kill 15,000 Goblins; Buy Axe","12"],
  ["CL4NK","Revolver","Crit Happens: Gain 1% Crit Chance per level.","Complete Forest Tier 1; Buy Revolver","14"],
  ["Athena","Aegis","Lock in: Deal more damage on lower HP. Gain 2 Thorns per level.","Get the Thorns Tome to level 9; Buy Aegis","16"],
  ["Robinette","Bow","Stonks: Gain 1% Gold Gain per level. Also increase Damage slightly by total Gold in inventory.","Complete Forest Tier 2; Buy Bow",""],
  ["Monke","Bananarang","Monke Grip: Climb up walls. Also gain +2 Max HP per level.","Find and Release Monke in the Forest","18"],
  ["Tony McZoom","Wireless Dagger","Zap: Charge an electric attack by moving around. Gain 2% pickup range per level.","Complete 2 Challenges; Buy Wireless Dagger","19"],
  ["Bush","Sniper Rifle","Bullseye: Random enemies are marked. Also gain 1% Crit Damage per level.","Find and Defeat Bush in the Forest; Buy Sniper Rifle","21"],
  ["Birdo","Tornado","Float: Hold \"Jump\" to float in the air. Also gain 1% Airborne Damage per level.","Kill 100 enemies using Tornado weapon while carried by a tornado on Desert; Buy Tornado",""],
  ["Noelle","Frostwalker","Enduring: Gain 1% Size per Level. Also increase Damage per currently frozen enemy.","Use a Microwave to duplicate Ice Crystal 3 times in a row; Buy Frostwalker",""],
  ["Amog","Poison Flask","Plague: Poisoned enemies explode on death, poisoning nearby enemies.","Poison 50,000 enemies with Moldy Cheese; Buy Poison Flask","26"],
  ["Spaceman","Blackhole","Quantum XP Theory: Gain 1% XP Gain per level.","Complete 6 Challenges; Buy Blackhole","28"],
  ["Bandit","Dexecutioner","Flowstate: Gain 1% Attack Speed per level.","Find and Defeat Bandit in the Desert; Buy Dexecutioner","30"],
  ["Ninja","Katana","Shadowstep: Execute an enemy upon evading them. Also gain 0.5% Evasion per level.","Complete Desert Tier 1; Buy Katana","32"],
  ["Vlad","Blood Magic","Vampire: Gain 1% Lifesteal per level.","Complete Desert Tier 2; Buy Blood Magic","32"],
  ["Sir Chadwell","Corrupted Sword","Gain 1% Difficulty per level.","Complete Forest Tier 3; Buy Corrupted Sword","33"],
  ["Dicehead","Dice","Gamba: Gain a Random Stat per level.","Complete 100 Quests; Buy Dice",""],
  ["Roberto","Scythe","Hoarder: Free chest every 60s, increasing to 120s over levels. He can also float.","Defeat Spooky Steve in the Graveyard; Buy Scythe",""],
];

const tbody = document.getElementById("tbody");
const count = document.getElementById("count");
const search = document.getElementById("search");

function render(){
  tbody.innerHTML = "";
  characters.forEach(c=>{
    const tr = document.createElement("tr");
    const src = iconPath(c[0]);
    const letter = (c[0] && c[0].length) ? c[0][0].toUpperCase() : "?";

    tr.innerHTML = `
      <td>
        <div class="item-cell">
          <div class="icon">
            <img src="${src}" alt="${c[0]} icon"
                 onerror="this.onerror=null; this.src='${placeholderIcon(letter)}';">
          </div>
          <div class="name">${c[0]}</div>
        </div>
      </td>
      <td class="nowrap">${c[1]}</td>
      <td>${c[2]}</td>
      <td>${c[3]}</td>
      <td class="nowrap">${c[4]}</td>
    `;
    tbody.appendChild(tr);
  });

  count.textContent = `Showing ${characters.length} characters.`;
}

search.addEventListener("input",()=>{
  const q = search.value.toLowerCase();
  let visible = 0;

  [...tbody.children].forEach(r=>{
    const show = r.innerText.toLowerCase().includes(q);
    r.style.display = show ? "" : "none";
    if(show) visible++;
  });

  count.textContent = `Showing ${visible} of ${characters.length} characters.`;
});

render();
</script>

</body>
</html>
