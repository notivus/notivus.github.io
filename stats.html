  function render(){
    const list = document.getElementById("list");
    const count = document.getElementById("count");
    const search = document.getElementById("search");

    list.innerHTML = "";

    rows.forEach(obj=>{
      const name = obj.Character || "";
      const src = iconPath(name);
      const letter = name ? name[0].toUpperCase() : "?";

      const row = document.createElement("div");
      row.className = "char-row";

      let statsHtml = "";
      for(const k of statKeys){
        const v = obj[k] ?? "";
        statsHtml += `
          <div class="stat" data-k="${esc(k)}" data-v="${esc(v)}">
            <div class="k" title="${esc(k)}">${esc(k)}</div>
            <div class="v" title="${esc(v)}">${esc(v)}</div>
          </div>
        `;
      }

      row.innerHTML = `
        <div class="item-cell">
          <div class="icon">
            <img src="${esc(src)}" alt="${esc(name)} icon"
                 onerror="this.onerror=null; this.src='${placeholderIcon(letter)}';">
          </div>
          <div class="name">${esc(name)}</div>
        </div>
        <div class="stats-grid">
          ${statsHtml}
        </div>
      `;

      list.appendChild(row);
    });

    const total = rows.length;
    count.textContent = `Showing ${total} characters.`;

    search.addEventListener("input", ()=>{
      const q = search.value.toLowerCase();
      let visible = 0;

      [...list.children].forEach(card=>{
        const txt = card.innerText.toLowerCase();
        const show = txt.includes(q);
        card.style.display = show ? "" : "none";
        if(show) visible++;
      });

      count.textContent = `Showing ${visible} of ${total} characters.`;
    });
  }

  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", render);
  }else{
    render();
  }
})();
