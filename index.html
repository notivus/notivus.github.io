<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                     Roboto, Helvetica, Arial, sans-serif;
        background: #0f1117;
        color: #f1f3f5;
    }

    .container {
        width: min(1100px, calc(100% - 40px));
        margin: 0 auto;
        padding: 70px 0;
    }

    header {
        margin-bottom: 45px;
    }

    .eyebrow {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #8b93a7;
        margin-bottom: 10px;
    }

    h1 {
        margin: 0;
        font-size: clamp(36px, 6vw, 58px);
        letter-spacing: -2px;
        line-height: 1;
    }

    .subtitle {
        margin-top: 16px;
        max-width: 600px;
        color: #9da5b5;
        font-size: 17px;
        line-height: 1.6;
    }

    .projects {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
    }

    .project {
        display: flex;
        flex-direction: column;
        min-height: 190px;
        padding: 24px;
        background: #171a22;
        border: 1px solid #272c38;
        border-radius: 16px;
        text-decoration: none;
        color: inherit;
        transition:
            transform 0.2s ease,
            border-color 0.2s ease,
            background 0.2s ease;
    }

    .project:hover {
        transform: translateY(-4px);
        border-color: #596273;
        background: #1b1f29;
    }

    .project-icon {
        width: 44px;
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
        border-radius: 12px;
        background: #232835;
        font-size: 21px;
    }

    .project h2 {
        margin: 0 0 8px;
        font-size: 20px;
        letter-spacing: -0.3px;
    }

    .project p {
        margin: 0;
        color: #929aaa;
        font-size: 14px;
        line-height: 1.55;
    }

    .project-footer {
        margin-top: auto;
        padding-top: 20px;
        color: #737c8f;
        font-size: 13px;
    }

    .project-footer span {
        transition: color 0.2s ease;
    }

    .project:hover .project-footer span {
        color: #d8dce4;
    }

    footer {
        margin-top: 50px;
        padding-top: 20px;
        border-top: 1px solid #20242e;
        color: #666e7f;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .container {
            width: min(100% - 28px, 1100px);
            padding: 45px 0;
        }

        header {
            margin-bottom: 30px;
        }

        .projects {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>

<body>

<div class="container">
<header>
    <div class="eyebrow">Project Hub</div>
    <h1>My Projects</h1>
    <div class="subtitle">
        A collection of things I've built, tinkered with, and am currently
        working on.
    </div>
</header>


<!-- =========================================================
     PROJECTS
     =========================================================

     To add a project, copy one of the blocks below.

     Change:
     - href       = where the project goes
     - icon       = emoji/icon
     - title      = project name
     - description = short description
     - status     = text at the bottom

     ========================================================= -->

<main class="projects">

    <a class="project" href="https://notivus.github.io/amc.html">
        <div class="project-icon">🎬</div>

        <h2>AMC Showtime Finder</h2>

        <p>
            AMC Shit
        </p>

        <div class="project-footer">
            <span>View project →</span>
        </div>
    </a>


    <a class="project" href="https://google.com">
        <div class="project-icon">💻</div>

        <h2>Placeholder</h2>

        <p>
            Placeholder
        </p>

        <div class="project-footer">
            <span>View project →</span>
        </div>
    </a>

    <a class="project" href="https://google.com">
        <div class="project-icon">💻</div>

        <h2>Placeholder</h2>

        <p>
            Placeholder
        </p>

        <div class="project-footer">
            <span>View project →</span>
        </div>
    </a>




    <!-- COPY THIS BLOCK TO ADD ANOTHER PROJECT

    <a class="project" href="https://example.com">
        <div class="project-icon">✨</div>

        <h2>Another Project</h2>

        <p>
            A short description of what this project does.
        </p>

        <div class="project-footer">
            <span>View project →</span>
        </div>
    </a>

    -->

</main>


<footer>
    © 2026 Notivus · Built with plain HTML & CSS
</footer>

</div>

</body>
</html>
