<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Tank Measurements</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        padding: 12px;
        font-family: Arial, sans-serif;
        background: #121212;
        color: white;
    }

    h1 {
        text-align: center;
        margin-bottom: 14px;
        font-size: 1.4rem;
    }

    .main-container {
        background: #1c1c1c;
        border-radius: 18px;
        padding: 10px;
    }

    .tank-row {
        display: flex;
        align-items: center;
        justify-content: center; /* ⭐ CENTER EVERYTHING */
        gap: 6px;
        padding: 10px 4px;
        border-bottom: 1px solid #2d2d2d;
    }

    .tank-label {
        width: 42px;
        font-weight: bold;
        text-align: right;
        margin-right: 4px;
    }

    .entry-group {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    input {
        width: 58px;
        padding: 10px 6px;
        border: none;
        border-radius: 10px;
        background: #2d2d2d;
        color: white;
        font-size: 1rem;
        text-align: center;
    }

    .unit {
        color: #aaa;
    }

    .btn {
        border: none;
        border-radius: 10px;
        color: white;
        padding: 8px 10px;
        font-size: 0.75rem;
        font-weight: bold;
        margin-left: 4px;
    }

    .skip-btn { background: #555; }
    .full-btn { background: #2c7be5; }

    .active-skip { background: #8b3d3d !important; }
    .active-full { background: #1f5fbf !important; }

    .copy-btn {
        width: 100%;
        margin-top: 16px;
        padding: 16px;
        border: none;
        border-radius: 14px;
        background: #18a558;
        color: white;
        font-size: 1rem;
        font-weight: bold;
    }

    textarea {
        width: 100%;
        height: 160px;
        margin-top: 14px;
        border-radius: 14px;
        border: none;
        background: #252525;
        color: white;
        padding: 12px;
    }
</style>
</head>

<body>

<h1>🛢 Tank Measurements 🛢</h1>

<div class="main-container" id="tankContainer"></div>

<button class="copy-btn" onclick="copyMeasurements()">Copy All</button>

<textarea id="output" readonly></textarea>

<script>

const tanks = ["P1","P2","P3","P4","P5","P6"];
const state = {};

function render() {

    const container = document.getElementById("tankContainer");

    let html = "";

    tanks.forEach((t, i) => {

        state[t] = { mode: "normal" };

        html += `
        <div class="tank-row">

            <div class="tank-label">${t}</div>

            <div class="entry-group">

                <input
                    id="feet-${t}"
                    type="tel"
                    inputmode="numeric"
                    autocomplete="off"
                    data-next="inches-${t}"
                />

                <span class="unit">'</span>

                <input
                    id="inches-${t}"
                    type="tel"
                    inputmode="numeric"
                    autocomplete="off"
                    data-next="${tanks[i+1] ? `feet-${tanks[i+1]}` : ''}"
                />

                <span class="unit">"</span>

                <button class="btn skip-btn"
                    onclick="setMode('${t}', 'skip', this)">
                    Skip
                </button>

                <button class="btn full-btn"
                    onclick="setMode('${t}', 'full', this)">
                    Full
                </button>

            </div>

        </div>`;
    });

    container.innerHTML = html;

    setupFlow();
}

function advanceToNextTank(tank) {

    const idx = tanks.indexOf(tank);

    if (idx >= 0 && idx < tanks.length - 1) {

        const nextTank = tanks[idx + 1];
        const nextFeet = document.getElementById(`feet-${nextTank}`);

        if (nextFeet) {
            setTimeout(() => {
                nextFeet.focus();
                nextFeet.select();
            }, 80);
        }
    }
}

function setMode(tank, mode, btn) {

    const feet = document.getElementById(`feet-${tank}`);
    const inches = document.getElementById(`inches-${tank}`);

    const skipBtn = btn.parentElement.querySelector(".skip-btn");
    const fullBtn = btn.parentElement.querySelector(".full-btn");

    skipBtn.classList.remove("active-skip");
    fullBtn.classList.remove("active-full");

    state[tank].mode = mode;

    feet.disabled = true;
    inches.disabled = true;

    feet.value = "";
    inches.value = "";

    if (mode === "skip") {
        skipBtn.classList.add("active-skip");
    }

    if (mode === "full") {
        fullBtn.classList.add("active-full");
    }

    // ⭐ AUTO ADVANCE AFTER BUTTON PRESS
    advanceToNextTank(tank);
}

function setupFlow() {

    const inputs = Array.from(document.querySelectorAll("input"));

    const timers = new Map();

    function goNext(input) {

        const nextId = input.dataset.next;

        if (nextId) {

            const next = document.getElementById(nextId);

            if (next) {

                setTimeout(() => {
                    next.focus();
                    next.select();
                }, 50);
            }

        } else {
            input.blur();
        }
    }

    inputs.forEach(input => {

        input.addEventListener("input", () => {

            input.value = input.value.replace(/[^0-9]/g, "");

            clearTimeout(timers.get(input));

            if (input.value.length >= 2) {
                goNext(input);
                return;
            }

            const timer = setTimeout(() => {
                if (input.value.length > 0) {
                    goNext(input);
                }
            }, 650);

            timers.set(input, timer);
        });

        input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                e.preventDefault();
                goNext(input);
            }
        });
    });
}

function copyMeasurements() {

    let out = "";

    tanks.forEach(t => {

        const mode = state[t].mode;

        if (mode === "skip") {
            out += `${t} SKIPPED\n`;
            return;
        }

        if (mode === "full") {
            out += `${t} FULL\n`;
            return;
        }

        const f = document.getElementById(`feet-${t}`).value || 0;
        const i = document.getElementById(`inches-${t}`).value || 0;

        out += `${t} ${f}' ${i}"\n`;
    });

    document.getElementById("output").value = out;

    navigator.clipboard.writeText(out);
}

render();

</script>

</body>
</html>
