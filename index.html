<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>Tank Measurements</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    body {
        margin: 0;
        padding: 12px;
        font-family: Arial, sans-serif;
        background: #121212;
        color: white;
    }

    h1 {
        text-align: center;
        margin-bottom: 14px;
        font-size: 1.4rem;
    }

    .main-container {
        background: #1c1c1c;
        border-radius: 18px;
        padding: 10px;
    }

    .tank-row {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 8px 4px;
        border-bottom: 1px solid #2d2d2d;
    }

    .tank-label {
        width: 42px;
        font-weight: bold;
    }

    input {
        width: 58px;
        padding: 10px 6px;
        border: none;
        border-radius: 10px;
        background: #2d2d2d;
        color: white;
        font-size: 1rem;
        text-align: center;
    }

    .unit {
        color: #aaa;
    }

    .skip-btn {
        margin-left: auto;
        border: none;
        border-radius: 10px;
        background: #555;
        color: white;
        padding: 10px 12px;
        font-size: 0.8rem;
        font-weight: bold;
    }

    .skip-btn.active {
        background: #8b3d3d;
    }

    .copy-btn {
        width: 100%;
        margin-top: 16px;
        padding: 16px;
        border: none;
        border-radius: 14px;
        background: #18a558;
        color: white;
        font-size: 1rem;
        font-weight: bold;
    }

    textarea {
        width: 100%;
        height: 160px;
        margin-top: 14px;
        border-radius: 14px;
        border: none;
        background: #252525;
        color: white;
        padding: 12px;
    }
</style>
</head>

<body>

<h1>🛢 Tank Measurements</h1>

<div class="main-container" id="tankContainer"></div>

<button class="copy-btn" onclick="copyMeasurements()">Copy All</button>

<textarea id="output" readonly></textarea>

<script>
const tanks = ["P1","P2","P3","P4","P5","P6"];

function render() {
    const container = document.getElementById("tankContainer");

    let html = "";

    tanks.forEach((t, i) => {

        html += `
        <div class="tank-row">

            <div class="tank-label">${t}</div>

            <input
                id="feet-${t}"
                type="tel"
                inputmode="numeric"
                autocomplete="off"
                data-next="inches-${t}"
            />

            <span class="unit">'</span>

            <input
                id="inches-${t}"
                type="tel"
                inputmode="numeric"
                autocomplete="off"
                data-next="${tanks[i+1] ? `feet-${tanks[i+1]}` : ''}"
            />

            <span class="unit">"</span>

            <button class="skip-btn" onclick="skip('${t}', this)">
                Skip
            </button>

        </div>`;
    });

    container.innerHTML = html;

    setupFlow();
}

function setupFlow() {

    const inputs = Array.from(document.querySelectorAll("input"));

    function goNext(current) {
        const nextId = current.dataset.next;

        if (nextId) {
            const next = document.getElementById(nextId);

            if (next) {
                setTimeout(() => {
                    next.focus();
                    next.select();
                }, 50);
            }
        } else {
            current.blur();
        }
    }

    inputs.forEach(input => {

        input.addEventListener("input", () => {

            // only digits
            input.value = input.value.replace(/[^0-9]/g, "");

            // 🧠 ADVANCE ON "0" KEY RULE
            // if user already typed 1 digit and presses 0 → treat as commit
            if (input.value.length === 2 && input.value.endsWith("0")) {

                goNext(input);
            }
        });

        input.addEventListener("keydown", (e) => {

            if (e.key === "Enter") {
                e.preventDefault();
                goNext(input);
            }
        });
    });
}

function skip(tank, btn) {

    const feet = document.getElementById(`feet-${tank}`);
    const inches = document.getElementById(`inches-${tank}`);

    const disabled = !feet.disabled;

    feet.disabled = disabled;
    inches.disabled = disabled;

    btn.classList.toggle("active", disabled);
    btn.textContent = disabled ? "Skipped" : "Skip";
}

function copyMeasurements() {

    let out = "";

    tanks.forEach(t => {

        const f = document.getElementById(`feet-${t}`).value || 0;
        const i = document.getElementById(`inches-${t}`).value || 0;

        out += `${t} ${i}" ${f}'\n`;
    });

    document.getElementById("output").value = out;

    navigator.clipboard.writeText(out);
}

render();
</script>

</body>
</html>
